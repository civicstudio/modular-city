<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | default: 'Modular City - A model civic website demonstrating best practices for transparent, accessible government.' }}"
    >
    <link
      rel="stylesheet"
      href="{{ '/assets/css/main.css' | relative_url }}"
    >
    <link
      rel="icon"
      href="{{ '/assets/img/mark.svg' | relative_url }}"
      type="image/svg+xml"
    >
    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.title }} RSS Feed"
      href="{{ '/feed.xml' | absolute_url }}"
    >
    {% include json-ld.html %}
  </head>
  <body class="bg-white">
    <a
      href="#main-content"
      class="absolute -top-20 left-4 z-50 rounded-md bg-white px-4 py-3 text-sm font-bold text-gray-900 shadow-lg ring-2 ring-primary-700 focus:top-4"
    >
      Skip to main content
    </a>

    {% include header.html %}

    <div
      id="main-content"
      class="flex flex-1 flex-col"
      tabindex="-1"
    >
      {{ content }}
    </div>

    {% include footer.html %}
    {% include ui/cookie-consent.html %}
    <script src="{{ '/assets/js/ui-components.js' | relative_url }}" defer></script>
  </body>
</html>
