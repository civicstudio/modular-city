url: "https://modularcity.org"
baseurl: ""
data_dir: _data/city

title: "Modular City"
description: "A model municipal website demonstrating best practices for civic web presence, open data, and transparent government."

# Hosted Touchpoints instance for feedback forms and request processes.
# Pages link to it; the build never calls it.
touchpoints_url: "https://touchpoints.app"
# Query parameter that pre-fills the hidden "which page" question on Touchpoints feedback forms.
touchpoints_page_param: "page"

plugins:
  - jekyll-sitemap
  - jekyll-datapage-generator

include:
  - .well-known

page_gen:
  - data: 'departments'
    template: 'department'
    name: 'slug'
    dir: 'departments'
    title: 'name'
  - data: 'services'
    template: 'service'
    name: 'slug'
    dir: 'services'
    title: 'name'

exclude:
  - package.json
  - package-lock.json
  - postcss.config.js
  - tailwind.config.js
  - node_modules
  - Gemfile
  - Gemfile.lock
  - bin
  - spec
  - README.md
  - Rakefile
  - CLAUDE.md
  - scripts
  - seed/README.md
