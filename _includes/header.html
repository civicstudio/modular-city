{% include usa-banner.html %}

<header class="bg-white border-b border-gray-200">
  <nav
    class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
    aria-label="Global"
  >
    <div class="flex lg:flex-1">
      <a
        href="/"
        class="-m-1.5 p-1.5 flex items-center gap-3"
      >
        <img
          class="h-10 w-auto"
          src="{{ '/assets/img/mark.svg' | relative_url }}"
          alt="Modular City seal"
        >
        <span class="text-lg font-bold text-gray-900">
          Modular City
        </span>
      </a>
    </div>
    <div class="flex lg:hidden">
      <button
        type="button"
        id="mobile-menu-button"
        class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-gray-700"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
        <span class="sr-only">Open main menu</span>
        <!-- Hamburger icon -->
        <svg
          id="menu-icon-open"
          class="size-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
        <!-- Close icon (hidden by default) -->
        <svg
          id="menu-icon-close"
          class="size-6 hidden"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
    <div class="hidden lg:flex lg:gap-x-8">
      <a
        href="/services"
        {% if page.url == '/services.html' or page.url == '/services' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url == '/services.html' or page.url == '/services' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        Services
      </a>
      <a
        href="/departments"
        {% if page.url == '/departments.html' or page.url == '/departments' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url == '/departments.html' or page.url == '/departments' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        Departments
      </a>
      <a
        href="/government"
        {% if page.url == '/government.html' or page.url == '/government' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url == '/government.html' or page.url == '/government' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        Government
      </a>
      <a
        href="/calendar"
        {% if page.url == '/calendar.html' or page.url == '/calendar' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url == '/calendar.html' or page.url == '/calendar' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        Calendar
      </a>
      <a
        href="{{ '/meetings/' | relative_url }}"
        {% if page.url contains '/meetings/' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url contains '/meetings/' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        Meetings
      </a>
      <a
        href="{{ '/blog' | relative_url }}"
        {% if page.url contains '/blog' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url contains '/blog' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        News
      </a>
      <a
        href="{{ '/311/' | relative_url }}"
        {% if page.url contains '/311/' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url contains '/311/' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        311
      </a>
      <a
        href="{{ '/beta/' | relative_url }}"
        {% if page.url contains '/beta/' %}aria-current="page"{% endif %}
        class="text-sm font-semibold leading-6 {% if page.url contains '/beta/' %}text-primary-700 border-b-2 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
      >
        Beta
      </a>
    </div>
    <div class="hidden lg:flex lg:flex-1 lg:justify-end">
      <div class="flex items-center gap-4">
        <a
          href="/civic-data.json"
          class="text-sm font-semibold leading-6 text-gray-700 hover:text-primary-700"
        >
          Open Data <span aria-hidden="true">&rarr;</span>
        </a>
        <a
          href="{{ '/login/' | relative_url }}"
          {% if page.url contains '/login/' %}aria-current="page"{% endif %}
          class="rounded-md border border-gray-300 px-3 py-2 text-sm font-semibold leading-6 {% if page.url contains '/login/' %}text-primary-700 border-primary-700{% else %}text-gray-900 hover:text-primary-700{% endif %}"
        >
          Sign in
        </a>
      </div>
    </div>
  </nav>
  <!-- Mobile menu -->
  <div
    id="mobile-menu"
    class="hidden lg:hidden border-t border-gray-200"
  >
    <div class="space-y-1 px-4 py-3">
      <a
        href="/services"
        {% if page.url == '/services.html' or page.url == '/services' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url == '/services.html' or page.url == '/services' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        Services
      </a>
      <a
        href="/departments"
        {% if page.url == '/departments.html' or page.url == '/departments' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url == '/departments.html' or page.url == '/departments' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        Departments
      </a>
      <a
        href="/government"
        {% if page.url == '/government.html' or page.url == '/government' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url == '/government.html' or page.url == '/government' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        Government
      </a>
      <a
        href="/calendar"
        {% if page.url == '/calendar.html' or page.url == '/calendar' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url == '/calendar.html' or page.url == '/calendar' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        Calendar
      </a>
      <a
        href="{{ '/meetings/' | relative_url }}"
        {% if page.url contains '/meetings/' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url contains '/meetings/' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        Meetings
      </a>
      <a
        href="{{ '/blog' | relative_url }}"
        {% if page.url contains '/blog' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url contains '/blog' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        News
      </a>
      <a
        href="{{ '/311/' | relative_url }}"
        {% if page.url contains '/311/' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url contains '/311/' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        311
      </a>
      <a
        href="{{ '/beta/' | relative_url }}"
        {% if page.url contains '/beta/' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url contains '/beta/' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        Beta
      </a>
      <a
        href="{{ '/login/' | relative_url }}"
        {% if page.url contains '/login/' %}aria-current="page"{% endif %}
        class="block rounded-md px-3 py-2 text-base font-semibold {% if page.url contains '/login/' %}bg-primary-50 text-primary-700{% else %}text-gray-900 hover:bg-gray-50{% endif %}"
      >
        Sign in
      </a>
      <a
        href="/civic-data.json"
        class="block rounded-md px-3 py-2 text-base font-semibold text-gray-700 hover:bg-gray-50"
      >
        Open Data
      </a>
    </div>
  </div>
</header>

<script>
(function() {
  var button = document.getElementById('mobile-menu-button');
  var menu = document.getElementById('mobile-menu');
  var iconOpen = document.getElementById('menu-icon-open');
  var iconClose = document.getElementById('menu-icon-close');

  if (button && menu) {
    button.addEventListener('click', function() {
      var isOpen = menu.classList.contains('hidden');
      menu.classList.toggle('hidden');
      button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      iconOpen.classList.toggle('hidden');
      iconClose.classList.toggle('hidden');
    });
  }
})();
</script>
