title: "Calendar"

<main class="bg-white">
  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
    <div class="md:flex md:items-center md:justify-between">
      <div class="min-w-0 flex-1">
        <h1 class="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl">Meetings & Events</h1>
        <p class="mt-2 text-lg text-gray-700">Public meetings, community events, and important deadlines.</p>
      </div>
      <div class="mt-4 flex md:ml-4 md:mt-0">
        <a href="/calendar.ics" download="modular-city-calendar.ics" class="inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">Export Calendar (.ics)</a>
      </div>
    </div>

    <div class="mt-8 flex flex-wrap gap-4">
      <div class="flex items-center gap-2">
        <span class="inline-flex size-3 rounded-full bg-primary-500"></span>
        <span class="text-sm text-gray-700">Public Meeting</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex size-3 rounded-full bg-green-600"></span>
        <span class="text-sm text-gray-700">Community Event</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex size-3 rounded-full bg-amber-600"></span>
        <span class="text-sm text-gray-700">Deadline</span>
      </div>
    </div>

    <div class="mt-8">
      {% include ui/calendar-list.html %}
    </div>

    <div class="mt-12 text-center">
      <p class="text-sm text-gray-700">
        Data source:
        <a href="https://github.com/civicstudio/modular-city/blob/main/_data/calendar.json" class="font-semibold text-primary-800 underline underline-offset-4 hover:text-primary-600" target="_blank" rel="noopener">_data/calendar.json</a>
      </p>
    </div>
  </div>
</main>
